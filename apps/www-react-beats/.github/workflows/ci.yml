name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: apps/www
      
      - name: Type check
        run: bun run type-check
        working-directory: apps/www
      
      - name: Lint
        run: bun run lint
        working-directory: apps/www
      
      - name: Format check
        run: bun run format:check
        working-directory: apps/www
  
  build:
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: apps/www
      
      - name: Build
        run: bun run build
        working-directory: apps/www
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'test-secret-key-for-ci-only-min-32-chars' }}
          BETTER_AUTH_URL: http://localhost:3000
