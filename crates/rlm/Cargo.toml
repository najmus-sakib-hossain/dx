[package]
name = "rlm"
version = "0.1.0"
edition = "2021"

[dependencies]
# Scripting engine for safe code execution
rhai = "1.20"

# HTTP client for LLM API calls
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1.42", features = ["full"] }

# JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Regex support
regex = "1.11"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Environment variables
dotenvy = "0.15"

# Async traits
async-trait = "0.1"
